let AC=null, MUTE=false; const sfxLast={};
try{ MUTE=localStorage.getItem(SKEY)==='off'; }catch(e){}
function audio(){ if(MUTE) return null; if(!AC){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); } if(AC.state==='suspended') AC.resume(); return AC; }
addEventListener('pointerdown',()=>audio(),{capture:true});
function tone(f,t0,dur,{type='square',vol=.08,to=null,att=.005}={}){
  const a=AC, o=a.createOscillator(), gn=a.createGain(), t=a.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  gn.gain.setValueAtTime(0,t); gn.gain.linearRampToValueAtTime(vol,t+att); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn).connect(a.destination); o.start(t); o.stop(t+dur+.02); }
function noise(t0,dur,vol,hp){ const a=AC, n=Math.max(1,a.sampleRate*dur|0), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), f=a.createBiquadFilter(), gn=a.createGain(); s.buffer=b; f.type='highpass'; f.frequency.value=hp; gn.gain.value=vol; s.connect(f).connect(gn).connect(a.destination); s.start(a.currentTime+t0); }
const SFX={
  click:()=>tone(660,0,.05,{vol:.035}),
  coin:()=>{ tone(988,0,.07,{type:'triangle',vol:.06}); tone(1319,.06,.15,{type:'triangle',vol:.06}); },
  cash:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.18,{type:'triangle',vol:.07})),
  fanfare:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.11,i===5?.6:.16,{vol:.06})),
  bad:()=>{ tone(220,0,.18,{type:'sawtooth',vol:.045,to:150}); tone(165,.16,.3,{type:'sawtooth',vol:.045,to:110}); },
  twist:()=>{ tone(196,0,.13,{vol:.06}); tone(185,.15,.13,{vol:.06}); tone(147,.32,.5,{type:'sawtooth',vol:.06,to:104}); },
  card:()=>{ noise(0,.08,.05,2500); tone(880,.03,.08,{type:'triangle',vol:.035}); },
  pop:()=>{ noise(0,.07,.07,1200); tone(420,0,.09,{type:'triangle',vol:.05,to:900}); },
  heart:()=>[784,988,1175].forEach((f,i)=>tone(f,i*.08,.22,{type:'sine',vol:.07})),
  ok:k=>{ const m=1+Math.min(k||0,12)*.045; tone(1047*m,0,.06,{type:'triangle',vol:.07}); tone(1568*m,.05,.13,{type:'triangle',vol:.06}); },
  wrong:()=>tone(150,0,.24,{vol:.055,to:90}),
  tick:()=>tone(1250,0,.035,{vol:.03}),
  pour:()=>noise(0,.05,.025,3500),
  bubble:()=>tone(rnd(260,480),0,.07,{type:'sine',vol:.035,to:rnd(600,900)}),
  bell:()=>[1319,1047].forEach((f,i)=>tone(f,i*.2,.55,{type:'sine',vol:.08})),
  chirp:()=>{ const f=rnd(2600,3600); tone(f,0,.05,{type:'sine',vol:.014,to:f*1.3}); tone(f*1.08,.08,.05,{type:'sine',vol:.012,to:f*1.4}); }
};
function sfx(k,gap,arg){ if(!AC&&navigator.userActivation&&!navigator.userActivation.hasBeenActive) return; const a=audio(); if(!a) return; const now=performance.now(); if(gap&&now-(sfxLast[k]||0)<gap) return; sfxLast[k]=now; try{ SFX[k](arg); }catch(e){} }
function buzz(p){ if(navigator.userActivation&&!navigator.userActivation.hasBeenActive) return; if(!MUTE&&navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
function setMute(m){ MUTE=m; try{ localStorage.setItem(SKEY,m?'off':'on'); }catch(e){} if(m&&AC) AC.suspend(); const b=$('sndBtn'); b.textContent=m?'🔇':'🔊'; b.title=m?'Bật âm thanh & rung':'Tắt âm thanh & rung'; }
$('sndBtn').onclick=()=>{ setMute(!MUTE); if(!MUTE) sfx('coin'); }; setMute(MUTE);
document.addEventListener('click',e=>{ if(e.target.closest('button')&&(!e.target.closest('.rpanel')||e.target.closest('#rEnd'))) sfx('click',40); },true);

/* ================= MINI-GAME PHA CHẾ: 4 trò xoay vòng theo tuần, đổi theo mùa ================= */
// 1–2 lần mỗi tháng (theo lịch planPeriod) khi đang xem quán chạy, lần lượt: giờ cao điểm → canh gram bột → canh nhiệt độ nước → chọn hạt cafe.
// Trò nào cũng chấm 1–3 sao → tiền boa, uy tín, khách quen. Có thể chơi tập trong Sổ sách (không tính tiền).
// Mùa: món theo mùa, độ kiên nhẫn của khách, gu đậm nhạt, độ ẩm của bột, nhiệt độ nước ban đầu, câu khách hỏi.
const SEAS=[
  {ico:'🌸',n:'Xuân',hot:.45,pat:1,tip:'Xuân · Tết: khách sộp, chuộng cả đồ nóng lẫn đá.'},
  {ico:'☀️',n:'Hạ',hot:.1,pat:.85,tip:'Hạ · nắng gắt: ai cũng đòi đá, mau sốt ruột.'},
  {ico:'🍂',n:'Thu',hot:.4,pat:1.15,tip:'Thu · mát trời: khách thong thả hơn.'},
  {ico:'❄️',n:'Đông',hot:.8,pat:1,tip:'Đông · rét: khách chuộng đồ nóng, uống đậm.'}];
const DRINKS=[
  {id:'den',n:'Cà phê đen',c:'#2b1a10',ice:1,w:2},{id:'sua',n:'Cà phê sữa',c:'#8a5a3b',ice:1,milk:1,w:3},{id:'bx',n:'Bạc xỉu',c:'#d8b48a',milk:2,w:2},{id:'tra',n:'Trà đá',c:'#c98a2a',ice:1,w:2},
  {id:'nong',n:'Cà phê sữa nóng',c:'#9a6a48',hot:1,milk:1,w:2},
  {id:'trung',n:'Cà phê trứng',c:'#5a3420',hot:1,egg:1,w:2,se:0},{id:'chanh',n:'Chanh đá',c:'#d6e86a',ice:1,w:3,se:1},
  {id:'cacao',n:'Ca cao nóng',c:'#6b3a22',hot:1,w:2,se:2},{id:'gung',n:'Trà gừng',c:'#d99a3a',hot:1,w:3,se:3},
  {id:'dua',n:'Bạc xỉu cốt dừa',c:'#efe4cf',milk:2,ice:1,w:2,need:()=>S.vil.linh&&S.vil.linh.h>=4},{id:'muoi',n:'Cà phê muối',c:'#a8784e',milk:1,ice:1,w:2,need:()=>isCity()}];
const drinkOf=id=>DRINKS.find(d=>d.id===id);
function cupSVG(d){ return `<svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${d.hot?'<rect x="6" y="0" width="1" height="2" fill="#ffffff" opacity=".8"/><rect x="9" y="1" width="1" height="2" fill="#ffffff" opacity=".7"/>':'<rect x="10" y="0" width="1" height="7" fill="#c4473a"/>'}<rect x="3" y="3" width="10" height="13" fill="#3b2516"/><rect x="4" y="4" width="8" height="11" fill="#eef6f4"/><rect x="4" y="7" width="8" height="8" fill="${d.c}"/>${d.milk?`<rect x="4" y="${d.milk>1?7:12}" width="8" height="3" fill="#f6efe2"/>`:''}${d.egg?'<rect x="4" y="6" width="8" height="3" fill="#f3d27a"/>':''}${d.ice?'<rect x="5" y="8" width="2" height="2" fill="#dff3ff"/><rect x="8" y="10" width="2" height="2" fill="#dff3ff"/>':''}<rect x="4" y="4" width="1" height="11" fill="#ffffff" opacity=".6"/></svg>`; }
function beanSVG(b){ return `<svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="${b.round?6:5}" ry="${b.round?6:6.6}" fill="${b.c}" stroke="#2b1d16" stroke-width="1"/><path d="M8 ${b.round?3:2.5} C5.8 6,10.2 10,8 ${b.round?13:13.5}" stroke="#e0bf8f" fill="none" stroke-width="1.1"/></svg>`; }
const wpick=(a,w)=>{ let x=Math.random()*w.reduce((s,v)=>s+v,0); for(let i=0;i<a.length;i++){ x-=w[i]; if(x<=0) return a[i]; } return a[0]; };
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const MG={
  rush:{t:'Giờ cao điểm',ico:'☕',how:'Khách gọi món dồn dập. Bấm <b>đúng món</b> cho người <b>đầu hàng</b> trước khi họ hết kiên nhẫn.'},
  weigh:{t:'Canh gram bột',ico:'⚖️',how:'<b>Giữ nút</b> để đổ bột vào phin, <b>thả tay</b> khi cân chạm vạch xanh. Thả rồi bột vẫn rơi thêm chút — nhớ thả sớm!'},
  temp:{t:'Canh nhiệt độ nước',ico:'🌡️',how:'Ấm nước đang nóng dần, lửa lúc to lúc nhỏ. Bấm <b>Rót!</b> khi kim nằm trong <b>vùng xanh</b> của món. Để sôi trào là hỏng.'},
  bean:{t:'Chọn hạt cafe',ico:'🫘',how:'Khách tả gu của mình. Chọn đúng <b>loại hạt</b>: Robusta, Arabica, Culi hay Moka — càng nhanh càng được boa.'}};
const MG_ORDER=['rush','weigh','temp','bean'];
let mg=null, mgPend=null;
const mgDue=r=>r.open&&!S.over;
function mgIntro(r,cb){
  const kind=MG_ORDER[(S.mgN=(S.mgN||0)+1)%MG_ORDER.length], m=MG[kind], se=SEAS[seasonNow()]; mgPend={kind,cups:r.cups,cb};
  win(m.t+'!',`<div class="ctag tg-tw">${m.ico} ${m.t} · ${se.ico} ${se.n}</div>
    <div class="say">${m.how}<br><span class="sm">${se.tip}</span> Làm tốt thì được <b>tiền boa</b>, uy tín và khách quen.</div>
    <div class="prbtns"><button class="wbtn gold" id="mgGo">${m.ico} Vào quầy!</button><button class="wbtn" id="mgSkip">Để người phụ lo</button></div>`,false);
  sfx('bell'); buzz([30,40,30]);
}
function mgStart(kind,cb,practice,cups){
  closeWin(); mgPend=null;
  mg={kind,cb,practice,cups:cups||40,se:seasonNow(),done:false,last:performance.now(),tickN:6,tips:0,combo:0,best:0};
  $('rush').hidden=false; MGS[kind].start(); requestAnimationFrame(mgLoop);
}
function mgLoop(now){ if(!mg||mg.done) return; const G=MGS[mg.kind]; G.tick(clamp((now-mg.last)/1000,0,.1)); if(mg) mg.last=now; if(mg&&!mg.done) requestAnimationFrame(mgLoop); }
function mgHead(){ const m=MG[mg.kind], se=SEAS[mg.se]; return `<div class="rtop"><span class="rtitle">${m.ico} ${m.t}</span><span class="chip info">${se.ico} ${se.n}</span><span class="rstat">Boa <b id="rTips">0</b></span><span class="rcombo" id="rCombo"></span></div>`; }
function mgStat(){ $('rTips').textContent=kk(mg.tips); const c=$('rCombo'), t=mg.combo>=2?'×'+mg.combo:''; if(c.textContent!==t){ c.textContent=t; if(mg.combo>=3){ c.classList.remove('pulse'); void c.offsetWidth; c.classList.add('pulse'); } } }
function mgClock(rem,dur){ const ti=$('rTime'); ti.style.width=Math.max(0,rem/dur*100)+'%'; ti.classList.toggle('low',rem<=5); if(rem<=5&&Math.ceil(rem)<mg.tickN){ mg.tickN=Math.ceil(rem); sfx('tick'); } }
function mgFloat(txt,bad,at){ const a=at||$('rQ'); if(!a) return; const f=document.createElement('span'); f.className='rfloat'+(bad?' bad':''); f.textContent=txt; f.style.left=(a.offsetLeft+16)+'px'; f.style.top=(a.offsetTop+a.offsetHeight*.45)+'px'; $('rPanel').appendChild(f); setTimeout(()=>f.remove(),800); }
// điểm mỗi lượt 0–3 → tiền boa; chuỗi lượt tốt (≥2) cộng dồn combo
function mgScore(gr,base){ if(gr>=2){ mg.combo++; mg.best=Math.max(mg.best,mg.combo); } else mg.combo=0;
  const tip=Math.round(S.price*(base||1)*[0,.2,.45,.75][gr]*(1+Math.min(mg.combo,6)*.1)/1000)*1000; mg.tips+=tip;
  if(gr>=2) sfx('ok',0,mg.combo); else if(gr===1) sfx('click'); else { sfx('wrong'); buzz(60); } return tip; }
function mgEnd(stars,rows){
  const z=mg, m=MG[z.kind]; z.done=true;
  if(!z.practice){
    S.cash+=z.tips; S.fans+=[1,3,6][stars-1]; S.rep=clamp(S.rep+[-.01,.02,.05][stars-1],.6,1.7);
    if(per){ const k='Tiền boa pha chế'; per.wk.lines[k]=(per.wk.lines[k]||0)+z.tips; }
    addLog(S.day,`${m.t}: ${stars}★, boa ${vnd(z.tips)}`,stars>1?'good':'bad');
    S.tot.mg=S.tot.mg||{}; S.tot.mg[z.kind]=Math.max(S.tot.mg[z.kind]||0,stars); save(); hudSlow(); }
  $('rPanel').innerHTML=`<div class="rres"><div class="rtitle">${m.ico} ${['Hơi đuối…','Ổn áp!','Tay pha thần sầu!'][stars-1]}</div>
    <div class="rstars">${'★'.repeat(stars)}<s>${'★'.repeat(3-stars)}</s></div>
    <div class="receipt" style="text-align:left">${rows.map(([a,b,c])=>`<div class="row"><span>${a}</span><b class="${c||''}">${b}</b></div>`).join('')}<hr>
      <div class="row"><b>Tiền boa</b><b class="pos">+${vnd(z.tips)}</b></div>
      <div class="row muted">${z.practice?'<span>Chơi tập</span><span>không tính tiền</span>':`<span>Uy tín · khách quen</span><span>${['giảm nhẹ','tăng','tăng mạnh'][stars-1]}</span>`}</div></div>
    <button class="wbtn go" id="rEnd">${z.practice?'Xong':'Tiếp tục ▶'}</button></div>`;
  sfx(stars===3?'fanfare':stars===2?'cash':'bad'); buzz(stars===3?[40,30,40,30,120]:40);
}
function mgClose(){ const cb=mg&&mg.cb; mg=null; $('rush').hidden=true; cb&&cb(); }

const MGS={};
/* --- giờ cao điểm: bấm đúng món cho người đầu hàng --- */
MGS.rush={
  start(){ const z=mg, se=SEAS[z.se];
    z.drinks=[...DRINKS.slice(0,4),...DRINKS.filter(d=>d.se===z.se),...DRINKS.filter(d=>d.need&&d.need()),...(se.hot>=.4?[drinkOf('nong')]:[])].slice(0,6);
    z.wts=z.drinks.map(d=>d.w*(d.ice?1.3-se.hot:1)*(d.hot?.4+se.hot*1.6:1));
    Object.assign(z,{t:0,dur:25,total:clamp(Math.round(z.cups*.45),10,36),spawned:0,next:0,orders:[],served:0,wrong:0,lost:0});
    $('rPanel').innerHTML=mgHead()+`<div class="rtime"><i id="rTime"></i></div><div class="rq" id="rQ"></div>
      <div class="rhint sm">Pha cho khách <b>đầu hàng</b> (viền vàng) trước</div>
      <div class="rd">${z.drinks.map((d,i)=>`<button class="dk" data-dk="${d.id}">${cupSVG(d)}<span>${d.n}</span><kbd>${i+1}</kbd></button>`).join('')}</div>`; },
  add(){ const z=mg, d=wpick(z.drinks,z.wts), v=pick(VIL), pat=6.8*SEAS[z.se].pat*(1+Math.min(S.staff,3)*.1)*(S.rep>1.1?1.1:1)*Math.max(.7,1-z.t*.012);
    const el=document.createElement('div'); el.className='tk'; el.innerHTML=`<img src="${portrait(v.id)}" alt="${v.n}">${cupSVG(d)}<small>${d.n}</small><i class="pb"><b></b></i>`;
    $('rQ').appendChild(el); z.orders.push({d,pat,left:pat,el}); z.spawned++; },
  drop(o,cls){ const i=mg.orders.indexOf(o); if(i>=0) mg.orders.splice(i,1); o.el.classList.add(cls); setTimeout(()=>o.el.remove(),260); },
  tick(dt){ const z=mg; z.t+=dt; const open=z.t<z.dur-1.5&&z.spawned<z.total;
    z.next-=dt; if(open&&(z.next<=0||!z.orders.length)&&z.orders.length<5){ this.add(); z.next=Math.max(.75,2.1-z.t*.05)*rnd(.8,1.2); }
    z.orders.slice().forEach(o=>{ o.left-=dt; if(o.left<=0){ z.lost++; z.combo=0; this.drop(o,'mad'); mgFloat('Bỏ về!',true); sfx('bad',300); buzz(50); } });
    mgClock(z.dur-z.t,z.dur);
    if(z.t>=z.dur||(z.spawned>=z.total&&!z.orders.length)) return this.end();
    z.orders.forEach((o,i)=>{ o.el.classList.toggle('first',i===0); const f=o.left/o.pat, b=o.el.querySelector('.pb b'); b.style.width=f*100+'%'; b.style.background=f>.5?'var(--green)':f>.25?'var(--gold)':'var(--red)'; });
    mgStat(); },
  serve(id){ const z=mg, o=z.orders[0]; if(!o) return;
    if(o.d.id===id){ z.served++; z.combo++; z.best=Math.max(z.best,z.combo);
      const tip=Math.round(S.price*.18*(1+.6*clamp(o.left/o.pat,0,1))*(1+Math.min(z.combo,10)*.1)/1000)*1000;
      z.tips+=tip; this.drop(o,'gone'); mgFloat('+'+kk(tip)); sfx('ok',0,z.combo); buzz(8); mgStat(); }
    else { z.wrong++; z.combo=0; o.left=Math.max(.4,o.left-1.5); o.el.classList.remove('no'); void o.el.offsetWidth; o.el.classList.add('no'); mgFloat('Sai món!',true); sfx('wrong'); buzz(60); } },
  down(e){ const b=e.target.closest('[data-dk]'); if(b) this.serve(b.dataset.dk); },
  key(e,up){ if(up) return; const k=+e.key; if(k>=1&&k<=mg.drinks.length) this.serve(mg.drinks[k-1].id); },
  end(){ const z=mg, stars=z.lost+z.wrong<=2&&z.served>=z.total*.75?3:z.served>=z.total*.5?2:1;
    mgEnd(stars,[['Pha đúng',z.served+' ly'],['Combo dài nhất','×'+z.best],['Pha sai',z.wrong],['Khách bỏ về',z.lost,z.lost?'neg':'']]); }
};

/* --- canh gram bột: giữ để đổ, thả đúng lúc; bột còn rơi thêm sau khi thả (mùa Hạ bột ẩm rơi nhiều hơn) --- */
const WEIGH=[{d:'den',g:20},{d:'sua',g:24},{d:'bx',g:12},{d:'nong',g:22},{d:'trung',g:18,se:0}];
const fmtG=g=>g.toFixed(1).replace('.',',')+'g';
MGS.weigh={
  start(){ const z=mg, pool=WEIGH.filter(w=>w.se==null||w.se===z.se), strong=z.se===3?2:0;
    z.rounds=Array.from({length:5},()=>{ const w=pick(pool); return {d:drinkOf(w.d),g:w.g+strong}; });
    Object.assign(z,{i:0,res:[],lag:z.se===1?[.6,1.7]:[.2,.9]});
    $('rPanel').innerHTML=mgHead()+`<div class="mgsub"><b id="wRound"></b><span class="sm" id="wNote"></span></div>
      <div class="mgrow"><span class="mgcup" id="wCup"></span><div class="mgbig" id="wG"></div><span class="mgtgt" id="wT"></span></div>
      <div class="gauge"><i class="zy" id="wZy"></i><i class="zg" id="wZg"></i><i class="fill" id="wFill"></i><i class="mk" id="wMk"></i></div>
      <div class="fb" id="wFb"></div>
      <button class="wbtn go hold" id="mgHold">Giữ để đổ bột</button>`;
    this.round(); },
  round(){ const z=mg, r=z.rounds[z.i], pct=v=>clamp(v/z.max*100,0,100); z.g=0; z.held=0; z.tail=0; z.state='ready'; z.max=r.g*1.7;
    $('wRound').textContent=`Ly ${z.i+1}/${z.rounds.length} · ${r.d.n}`; $('wT').textContent='cần '+r.g+'g';
    $('wNote').textContent=z.se===1?'Trời nồm, bột ẩm rơi lốp cốp':z.se===3?'Trời lạnh, khách thích đậm hơn':'';
    $('wCup').innerHTML=cupSVG(r.d); $('wFb').textContent='';
    Object.assign($('wZy').style,{left:pct(r.g-2.5)+'%',width:(pct(r.g+2.5)-pct(r.g-2.5))+'%'});
    Object.assign($('wZg').style,{left:pct(r.g-1)+'%',width:(pct(r.g+1)-pct(r.g-1))+'%'}); this.draw(); },
  draw(){ const z=mg, p=clamp(z.g/z.max*100,0,100); $('wG').textContent=fmtG(z.g); $('wMk').style.left=p+'%'; $('wFill').style.width=p+'%'; mgStat(); },
  press(){ const z=mg; if(z.state!=='ready') return; z.state='pour'; $('mgHold').classList.add('on'); },
  release(){ const z=mg; if(!z||z.state!=='pour') return; z.state='settle'; $('mgHold').classList.remove('on'); z.tail=rnd(...z.lag)*(1+z.held*.12); z.st=.45; },
  down(e){ if(e.target.closest('#mgHold')) this.press(); },
  up(){ this.release(); },
  key(e,up){ if(e.code==='Space'){ e.preventDefault(); if(up) this.release(); else if(!e.repeat) this.press(); } },
  tick(dt){ const z=mg;
    if(z.state==='pour'){ z.held+=dt; z.g+=(4+z.held*5)*dt; sfx('pour',75); if(z.g>=z.max) this.release(); }
    else if(z.state==='settle'){ const a=Math.min(z.tail,dt*2.5); z.g+=a; z.tail-=a; if(a>0) sfx('pour',150); z.st-=dt; if(z.st<=0&&z.tail<=0) this.judge(); }
    else if(z.state==='show'){ z.st-=dt; if(z.st<=0){ z.i++; if(z.i>=z.rounds.length) return this.end(); this.round(); } }
    this.draw(); },
  judge(){ const z=mg, r=z.rounds[z.i], err=z.g-r.g, a=Math.abs(err), gr=a<=.7?3:a<=1.5?2:a<=3?1:0; z.res.push({gr,a});
    const tip=mgScore(gr);
    $('wFb').innerHTML=[err>0?'<span class="neg">Đậm quá, đắng nghét!</span>':'<span class="neg">Nhạt thếch!</span>','<span>Hơi lệch, tạm được</span>','<span class="pos">Ngon!</span>','<span class="pos">Chuẩn từng gram!</span>'][gr]+(tip?` <b class="pos">+${kk(tip)}</b>`:'');
    z.state='show'; z.st=1.2; },
  end(){ const z=mg, s=z.res.reduce((a,b)=>a+b.gr,0), stars=s>=12?3:s>=7?2:1, avg=z.res.reduce((a,b)=>a+b.a,0)/z.res.length;
    mgEnd(stars,[['Ly chuẩn (lệch ≤ 0,7g)',z.res.filter(x=>x.gr===3).length+'/'+z.res.length],['Lệch trung bình',fmtG(avg)],['Chuỗi ngon dài nhất','×'+z.best]]); }
};

const TEMPS=[{n:'Phin cà phê',d:'den',lo:90,hi:96,why:'Nước 90–96°C chiết vừa đủ vị đậm, không khét.'},
  {n:'Trà (pha trà đá)',d:'tra',lo:80,hi:88,why:'Nước sôi già làm trà chát, mất thơm.'},
  {n:'Ca cao nóng',d:'cacao',lo:70,hi:80,why:'Ca cao, sữa mà quá nóng dễ vón, mất béo.'},
  {n:'Trà gừng',d:'gung',lo:95,hi:100,why:'Gừng cần nước thật sôi mới dậy mùi cay ấm.'}];
const T0=20, T1=105, tpct=t=>clamp((t-T0)/(T1-T0)*100,0,100);
MGS.temp={
  start(){ const z=mg, w=[[3,2,1,2],[3,3,1,0],[3,2,3,1],[3,1,2,3]][z.se];
    z.rounds=Array.from({length:5},()=>wpick(TEMPS,w)); Object.assign(z,{i:0,res:[],amb:[24,32,26,15][z.se],over:0});
    $('rPanel').innerHTML=mgHead()+`<div class="mgsub"><b id="tRound"></b><span class="sm" id="tZone"></span></div>
      <div class="mgrow"><span class="mgcup" id="tCup"></span><div class="mgbig" id="tT"></div><span class="kettle" id="tK">🫖</span></div>
      <div class="gauge"><i class="zy" id="tZy"></i><i class="zg" id="tZg"></i><i class="fill hot" id="tFill"></i><i class="mk" id="tMk"></i><i class="boil" style="left:${tpct(100)}%"></i></div>
      <div class="fb" id="tFb"></div>
      <button class="wbtn gold hold" id="mgPour">Rót!</button>`;
    this.round(); },
  round(){ const z=mg, r=z.rounds[z.i]; z.T=z.amb+rnd(-3,3); z.v=rnd(7,9.5)+z.i*1.4; z.ph=rnd(0,6); z.boil=0; z.state='heat';
    $('tRound').textContent=`Ấm ${z.i+1}/${z.rounds.length} · ${r.n}`; $('tZone').textContent=`vùng xanh ${r.lo}–${r.hi}°C`;
    $('tCup').innerHTML=cupSVG(drinkOf(r.d)); $('tFb').textContent='';
    Object.assign($('tZy').style,{left:tpct(r.lo-4)+'%',width:(tpct(r.hi+4)-tpct(r.lo-4))+'%'});
    Object.assign($('tZg').style,{left:tpct(r.lo)+'%',width:(tpct(r.hi)-tpct(r.lo))+'%'}); this.draw(); },
  draw(){ const z=mg, p=tpct(z.T); $('tT').textContent=Math.floor(z.T)+'°C'; $('tMk').style.left=p+'%'; $('tFill').style.width=p+'%';
    $('tK').style.transform=z.T>85&&z.state==='heat'?`translateY(${Math.sin(tt*40)*1.5}px)`:''; mgStat(); },
  pour(){ if(mg.state==='heat') this.judge(false); },
  down(e){ if(e.target.closest('#mgPour')) this.pour(); },
  key(e,up){ if(!up&&(e.code==='Space'||e.key==='Enter')){ e.preventDefault(); this.pour(); } },
  tick(dt){ const z=mg, r=z.rounds[z.i];
    if(z.state==='heat'){ z.ph+=dt; const surge=Math.max(.3,1+.55*Math.sin(z.ph*1.7)+.25*Math.sin(z.ph*4.3));
      z.T=Math.min(100,z.T+z.v*surge*dt*(z.T>85?1.25:1));
      if(z.T>=100){ z.boil+=dt; sfx('bubble',110); if(z.boil>(r.hi>=100?1.4:.5)) this.judge(true); } else if(z.T>80) sfx('bubble',240); }
    else if(z.state==='show'){ z.st-=dt; if(z.st<=0){ z.i++; if(z.i>=z.rounds.length) return this.end(); this.round(); } }
    this.draw(); },
  judge(over){ const z=mg, r=z.rounds[z.i], T=z.T; let gr;
    if(over&&r.hi<100) gr=0; else if(T>=r.lo&&T<=r.hi) gr=Math.abs(T-(r.lo+r.hi)/2)<=(r.hi-r.lo)/4?3:2; else gr=T>=r.lo-4&&T<=r.hi+4?1:0;
    if(over&&gr===0) z.over++; z.res.push(gr); const tip=mgScore(gr);
    const head=gr===0?(over?'Sôi trào, bỏng tay!':T<r.lo?'Nước nguội, nhạt vị!':'Quá nóng, khét đắng!'):['','Hơi lệch, tạm được','Ngon!','Chuẩn nhiệt!'][gr];
    $('tFb').innerHTML=`<span class="${gr>=2?'pos':gr?'':'neg'}">${head}</span>${tip?` <b class="pos">+${kk(tip)}</b>`:''}<small>${r.why}</small>`;
    z.state='show'; z.st=1.7; },
  end(){ const z=mg, s=z.res.reduce((a,b)=>a+b,0), stars=s>=12?3:s>=7?2:1;
    mgEnd(stars,[['Ấm chuẩn nhiệt',z.res.filter(x=>x===3).length+'/'+z.res.length],['Rót trong vùng xanh',z.res.filter(x=>x>=2).length+'/'+z.res.length],['Sôi trào',z.over,z.over?'neg':''],['Chuỗi ngon dài nhất','×'+z.best]]); }
};

  const o=$('hOpen'), miss=missingDocs(), open=isOpen();

// iPhone Duo, màu Trời Đêm: máy gập kiểu quyển sách — gập lại gần vuông (3:4), mở ra thành màn hình ngang có nếp gập giữa;
// lưng có dải camera nằm ngang 2 ống kính lớn. Cố ý không vẽ logo hay chữ trên lưng máy.
// rot: góc xoay quanh trục dọc (cos<0 là thấy lưng), open: 0 gập → 1 mở hẳn, on: 0 tắt → 1+ đã bật (hiện lời chào)
function drawDuo(x,px,py,sc,rot,open,on,t){ open=open||0; on=on||0; t=t||0;
  const rr=(a,b,w,h,r,c)=>{ x.fillStyle=c; x.beginPath(); if(x.roundRect) x.roundRect(a,b,w,h,Math.max(0,Math.min(r,w/2,h/2))); else x.rect(a,b,w,h); x.fill(); };
  const ell=(a,b,rx,ry,c)=>{ x.fillStyle=c; x.beginPath(); x.ellipse(a,b,Math.max(.1,rx),Math.max(.1,ry),0,0,7); x.fill(); };
  const c=Math.cos(rot), k=Math.max(.06,Math.abs(c)), H=40*sc, W=30*sc*(1+open*.95)*k, l=px-W/2, tp=py-H/2, R=5*sc, f=.8*sc;
  x.save(); x.shadowColor='rgba(255,210,140,.5)'; x.shadowBlur=7*sc; rr(l-f,tp-f,W+f*2,H+f*2,R+f,'#5b6678'); x.restore();
  rr(l-f,tp-f,W+f*2,H+f*2,R+f,'#8590a2'); // khung titan
  if(c<0){ // mặt lưng: kính mờ xanh than, dải camera ngang
    rr(l,tp,W,H,R,'#26324a'); const gr=x.createLinearGradient(l,tp,l+W,tp+H); gr.addColorStop(0,'rgba(255,255,255,.16)'); gr.addColorStop(.45,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(0,0,0,.22)'); x.fillStyle=gr; x.beginPath(); if(x.roundRect) x.roundRect(l,tp,W,H,R); else x.rect(l,tp,W,H); x.fill();
    if(k>.3){ const bx0=l+2.5*sc*k, by0=tp+2.5*sc, bw=18*sc*k, bh=8.6*sc;
      rr(bx0-.4*sc,by0-.4*sc,bw+.8*sc,bh+.8*sc,4.6*sc*k,'#1c2638'); rr(bx0,by0,bw,bh,4.3*sc*k,'#34425e'); rr(bx0+sc*k,by0+.3*sc,bw-2*sc*k,.5*sc,.3*sc,'rgba(255,255,255,.25)');
      [5,13].forEach(dx=>{ const lx=bx0+dx*sc*k, ly=by0+bh/2; ell(lx,ly,3.2*sc*k,3.2*sc,'#6a768a'); ell(lx,ly,2.5*sc*k,2.5*sc,'#0b0e15'); ell(lx,ly,1.5*sc*k,1.5*sc,'#1d2c4a'); ell(lx-.7*sc*k,ly-.7*sc,.55*sc*k,.55*sc,'#9fc0ff'); });
      ell(l+23.5*sc*k,by0+2.6*sc,1.1*sc*k,1.1*sc,'#e9e2c6'); ell(l+23.5*sc*k,by0+6*sc,.4*sc*k,.4*sc,'#0b0e15'); } }
  else { // mặt trước: viền đen mỏng, màn hình
    rr(l,tp,W,H,R,'#08080c'); const s=1.1*sc, sl=l+s, st=tp+s, sw=W-s*2, sh=H-s*2; if(sw<1) return;
    x.save(); x.beginPath(); if(x.roundRect) x.roundRect(sl,st,sw,sh,R-s*.6); else x.rect(sl,st,sw,sh); x.clip();
    if(on>0){ const gr=x.createLinearGradient(0,st,0,st+sh); gr.addColorStop(0,'#3a2418'); gr.addColorStop(1,'#140c08'); x.fillStyle=gr; x.fillRect(sl,st,sw,sh);
      const a=Math.min(1,on), wide=open>.6, cx=wide?px-sw*.2:px, cy=wide?py:py-3*sc; x.globalAlpha=a;
      rr(cx-4*sc,cy-2*sc,8*sc,6*sc,1*sc,'#f4efe6'); x.fillStyle='#8a5a3b'; x.fillRect(cx-4*sc,cy-2*sc,8*sc,1.5*sc); rr(cx+3.5*sc,cy-.5*sc,2.2*sc,3*sc,1*sc,'#f4efe6');
      for(let i=0;i<2;i++){ const q=(t*.8+i*.5)%1; x.globalAlpha=a*(1-q); x.fillStyle='#ffffff'; x.fillRect(cx-1.5*sc+i*2.5*sc,cy-4*sc-q*6*sc,.8*sc,2*sc); }
      x.globalAlpha=Math.min(1,Math.max(0,on-.6)); x.fillStyle='#ffe2a0'; x.font=`800 ${Math.max(5,Math.round(2.8*sc))}px "Be Vietnam Pro",sans-serif`;
      if(wide){ x.textAlign='left'; x.fillText('Xin chào,',px-sw*.02,py-.5*sc); x.fillText('chủ quán',px-sw*.02,py+3.4*sc); }
      else { x.textAlign='center'; x.fillText('Xin chào,',cx,cy+9*sc); x.fillText('chủ quán',cx,cy+12.5*sc); }
      x.textAlign='left'; x.globalAlpha=1; }
    else { const gr=x.createLinearGradient(0,st,0,st+sh); gr.addColorStop(0,'#1a2236'); gr.addColorStop(.55,'#6a4a62'); gr.addColorStop(1,'#2a2232'); x.fillStyle=gr; x.fillRect(sl,st,sw,sh);
      x.fillStyle='#3a2a3e'; x.beginPath(); x.moveTo(sl,st+sh*.72); for(let i=0;i<=8;i++) x.lineTo(sl+sw*i/8,st+sh*(.6+.1*Math.sin(i*1.7))); x.lineTo(sl+sw,st+sh); x.lineTo(sl,st+sh); x.fill();
      x.fillStyle='#1e1824'; x.beginPath(); x.moveTo(sl,st+sh*.84); for(let i=0;i<=6;i++) x.lineTo(sl+sw*i/6,st+sh*(.78+.06*Math.cos(i*2.3))); x.lineTo(sl+sw,st+sh); x.lineTo(sl,st+sh); x.fill(); }
    if(open>.02){ // nếp gập giữa; nửa trái còn nghiêng thì tối hơn
      x.fillStyle='rgba(0,0,0,.28)'; x.fillRect(px-.35*sc,st,.7*sc,sh); x.fillStyle='rgba(255,255,255,.07)'; x.fillRect(px+.35*sc,st,.4*sc,sh);
      if(open<1){ x.fillStyle=`rgba(0,0,0,${.55*(1-open)})`; x.fillRect(sl,st,px-sl,sh); } }
    x.restore();
    if(open<.02) ell(px,st+2.2*sc,.85*sc,.85*sc,'#000'); } // camera đục lỗ ở màn ngoài
}

const ICP={k:'#3b2516',w:'#fff6dd',l:'#b89a6a',r:'#c4473a',g:'#3f8a42',G:'#7fc060',b:'#7a4a2b',d:'#a8743f',y:'#e6d29a',s:'#f2c9a4',p:'#c4473a',c:'#6b4329',W:'#ffffff',P:'#f08aa8',V:'#8e5aa8',B:'#4f86c6'};

  paper:['.kkkkkkk....','.kwwwwwwk...','.kwllllwwk..','.kwwwwwwwwk.','.kwllllllwk.','.kwwwwwwwwk.','.kwllllllwk.','.kwwwwwrrwk.','.kwlllrrrrk.','.kwwwwrrrrk.','.kwwwwwrrwk.','.kkkkkkkkkk.'],

function icoSVG(n){ let r=''; ICONS[n].forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch!=='.') r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${ICP[ch]}"/>`; })); return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`; }
document.querySelectorAll('[data-ico]').forEach(i=>i.innerHTML=icoSVG(i.dataset.ico));
$('bSkip').onclick=()=>{ if(per&&!per.auto){ per.anim=false; per.auto=[]; toast('Tua nhanh: tình huống tự chọn ngẫu nhiên, cuối kỳ báo kết quả'); } finish(); };
function reset(){ if(busy) return; edit=null; uiHidden=false; popOpen=false; $('bShow').hidden=true; $('cat').hidden=true; S=null; try{localStorage.removeItem(KEY)}catch(e){} $('hud').hidden=true; $('dock').hidden=true; $('ctl').hidden=true; ikey=''; showSetup(); }
function save(){ try{ if(S) localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function boot(){ if(!S.layout) S.layout=JSON.parse(JSON.stringify(DEFAULT_LAYOUT)); if(S.cart==null) S.cart=1;
  // bản lưu cũ: đồ nằm đè lên ao/luống rau/góc rửa thì dỡ ra và hoàn tiền
  S.layout=S.layout.filter(o=>{ const it=catOf(o.id); if(!it) return false; for(let y=o.r;y<o.r+it.h;y++) for(let x=o.c;x<o.c+it.w;x++) if(decorCell(x,y)){ S.cash+=it.cost; return false; } return true; });
  if(S.weeds) S.weeds=S.weeds.filter(w=>!decorCell(w.c,w.r));
  ikey=''; render(); }
function start(){
  initPets(); requestAnimationFrame(frame);
  try{ const raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); return boot(); } }catch(e){}
  showSetup();
}
start();
