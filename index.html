<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cafe Lên Phố</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&family=Pixelify+Sans:wght@500;700&display=swap">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="stage"><div id="frame"><canvas id="scene" aria-label="Sân vườn cafe làng quê"></canvas>

<div class="hud" id="hud" hidden>
  <div class="plate hl" id="hL"><button class="hsum" id="hSumL" aria-expanded="false" title="Bấm để xem chi tiết"><b class="big" id="hClock">--:--</b><span class="sm" id="hShort"></span><i class="sdot" id="hDot"></i><i class="car"></i></button><div class="hmini" title="Sức khoẻ chủ quán: dưới 0 là gục ngã. Nghỉ ngơi, thuê người phụ để hồi sức."><span id="hHp"></span><div class="hpbar"><i id="hHpBar"></i></div></div><div class="hmore"><div class="sm" id="hDate"></div><div class="chips"><button class="chip" id="hOpen" title="Bấm để mở cửa / nghỉ bán"></button><span class="chip weed" id="hWeed" title="Bấm vào bụi cỏ trong vườn để nhổ"></span><span class="chip info" id="hInfo"></span><span class="chip" id="hSuc" title="Sức khoẻ chủ quán: dưới 0 là gục ngã"></span></div></div></div>
  <div class="plate hr" id="hR"><div class="row"><button class="hsum" id="hSumR" aria-expanded="false" title="Bấm để xem uy tín & mục tiêu"><b class="big" id="hCash"></b><i class="car"></i></button><span class="hbtns"><button class="fs" id="bLook" title="Ngắm vườn: ẩn bảng và nút, thời gian vẫn trôi (phím H)" aria-label="Ngắm vườn"><i data-ico="eyeoff"></i></button><button class="fs" id="sndBtn" title="Tắt âm thanh & rung" aria-label="Âm thanh">🔊</button><button class="fs" id="fsBtn" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button></span></div><div class="hmini"><span id="hCap" title="Vốn ban đầu bạn bỏ ra"></span><span id="hFlow" title="Dòng tiền: lãi/lỗ vận hành trung bình (đã trừ tiền thuê, lương, nguyên liệu), quy ra một tháng, tính trên 28 ngày gần nhất"></span></div><div class="gbar" id="hGoalBox"><i id="hBar"></i></div><div class="hmore"><div class="sm">Uy tín <span id="hRep"></span></div><div class="row goalrow"><span class="sm" id="hGoalT">iPhone Duo</span><span class="sm num" id="hGoal"></span></div></div></div>
</div>
<div class="toast plate" id="toast" hidden></div>

<div class="pop plate" id="ctl" hidden>
  <div class="pophead"><b>Quầy cafe</b><button class="x smx" id="popX" aria-label="Đóng">✕</button></div>
  <div class="steps">
    <div class="step"><span>Giá/ly</span><button class="sq" data-step="price" data-d="-1000" aria-label="Giảm giá">−</button><b id="cPrice"></b><button class="sq" data-step="price" data-d="1000" aria-label="Tăng giá">+</button></div>
    <div class="step"><span>Người phụ</span><button class="sq" data-step="staff" data-d="-1" aria-label="Bớt người phụ">−</button><b id="cStaff"></b><button class="sq" data-step="staff" data-d="1" aria-label="Thêm người phụ">+</button></div>
    <div class="step"><span>Nghỉ/tuần</span><button class="sq" data-step="rest" data-d="-1" aria-label="Bớt ngày nghỉ">−</button><b id="cRest"></b><button class="sq" data-step="rest" data-d="1" aria-label="Thêm ngày nghỉ">+</button></div>
  </div>
  <div class="tgs">
    <button class="tgb" data-tg="open" title="Mở bán. Thiếu giấy tờ dễ bị phạt.">Mở cửa</button>
    <button class="tgb" data-tg="del" title="+22% đơn, trả xe ôm 6.000đ/đơn">Ship Zalo</button>
    <button class="tgb" data-tg="walk" title="+20% khách, dễ bị nhắc lấn chiếm đường">Ghế ra đường</button>
    <button class="tgb" data-tg="music" title="+5% khách, cần giấy phép nhạc, hàng xóm có thể phàn nàn">Loa nhạc</button>
    <button class="tgb" data-tg="ads" title="200k/ngày, +15% khách">Quảng cáo FB</button>
    <button class="tgb" data-tg="tik" title="Miễn phí, có cơ hội viral">TikTok</button>
    <button class="tgb" data-tg="tidy" title="Thuê dọn mỗi ngày: quán sạch hơn, tốn thêm tiền">Dọn dẹp kỹ</button>
  </div>
</div>
<div class="bar plate" id="dock" hidden>
  <div class="tctl" role="group" aria-label="Thời gian">
    <button class="tb" data-t="pause" title="Dừng / chạy tiếp (phím Space)"><i data-ico="pause"></i><span>Dừng</span></button>
    <button class="tb" data-t="1" title="Chạy tốc độ thường"><i data-ico="play"></i><span>×1</span></button>
    <button class="tb" data-t="2" title="Chạy nhanh gấp đôi"><i data-ico="ff"></i><span>×2</span></button>
    <button class="tb" data-t="end" title="Chạy thật nhanh tới cuối tháng, vẫn dừng ở mỗi tình huống cho bạn chọn"><i data-ico="end"></i><span>Hết tháng</span></button>
  </div>
  <button class="slot" id="bOps" title="Quầy: giá, người phụ, bật/tắt dịch vụ"><i data-ico="cup"></i><span>Quầy</span></button>
  <button class="slot" id="bEdit" title="Thiết kế vườn: kéo thả, mua thêm đồ"><i data-ico="tree"></i><span>Vườn</span></button>
  <button class="slot" data-open="docs" title="Hồ sơ hộ kinh doanh"><i data-ico="paper"></i><span>Giấy tờ</span><b class="dot" id="docDot" hidden></b></button>
  <button class="slot" id="bSo" title="Sổ: dân làng, sổ sách, sổ tay cà phê"><i data-ico="book"></i><span>Sổ</span></button>
  <button class="slot gold" id="bBuy" hidden title="Ra cửa hàng lên đời iPhone"><i data-ico="phone"></i><span>Lên đời!</span></button>
</div>
<div class="peek plate" id="peek" hidden><span id="pkDate"></span><b id="pkCash"></b><button class="tb" id="pkPause"></button><button class="tb" id="pkShow" title="Hiện bảng và nút (phím H)"><i data-ico="eye"></i><span>Hiện</span></button></div>
<div class="cat plate" id="cat" hidden>
  <div class="catrow" id="catRow"></div>
  <div class="catfoot"><span class="sm" id="catInfo"></span><button class="wbtn" id="bDel">Dỡ bỏ</button><button class="wbtn go" id="bDone">Xong</button></div>
</div>
<button class="zoom plate" id="bZoom" hidden></button>
<div class="fade" id="fade"></div>
<div class="sevbar plate" id="sevBar" hidden><b id="sevT"></b><span class="sm" id="sevH"></span><div class="rtime"><i id="sevTime"></i></div><div id="sevR"></div></div>
</div></div>

<div class="rush" id="rush" hidden><div class="rpanel plate" id="rPanel"></div></div>

<div class="veil" id="veil" hidden><div class="win plate" role="dialog" aria-modal="true"><header><h2 id="wTitle"></h2><button class="x" id="wClose" aria-label="Đóng">✕</button></header><div class="body" id="wBody"></div></div></div>

<script src="js/i18n.js"></script>
<script src="lang/en.js"></script>
<script src="lang/ja.js"></script>
<script src="js/data.js"></script>
<script src="js/story.js"></script>
<script src="js/day.js"></script>
<script src="js/events.js"></script>
<script src="js/scene.js"></script>
<script src="js/edit.js"></script>
<script src="js/people.js"></script>
<script src="js/incidents.js"></script>
<script src="js/loop.js"></script>
<script src="js/sound.js"></script>
<script src="js/minigame.js"></script>
<script src="js/coffeebook.js"></script>
<script src="js/ui.js"></script>
<script src="js/upgrade.js"></script>
<script src="js/main.js"></script>
</body>
</html>
